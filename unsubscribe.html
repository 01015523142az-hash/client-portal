<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unsubscribe</title>
<!--
  v758: the unsubscribe link in every client email campaign's footer lands here
  (?r=<recipient id>). A Supabase function cannot serve an HTML page, so this
  static page calls marketing-unsubscribe. It asks for one click rather than
  unsubscribing on load, because mail scanners open links on their own and
  would unsubscribe people who never asked. Gmail/Yahoo one-click unsubscribe
  does not come through here -- Telnyx handles that from the email headers.
-->
<style>
  :root { --bg:#f6f3ee; --card:#ffffff; --text:#1f2328; --text-2:#5b6068; --border:#e3ddd3; --accent:#1f6feb; --good:#1a9a5c; --bad:#c3272c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10131a; --card:#171b23; --text:#e8e6e1; --text-2:#a3a7ae; --border:#2a303b; --accent:#6aa3ff; --good:#3dd68c; --bad:#ff7a7e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px 24px; }
  h1 { font-size:21px; margin:0 0 10px; }
  p { margin:0 0 14px; color:var(--text-2); }
  b { color:var(--text); }
  button { width:100%; border:0; border-radius:8px; padding:12px 16px; font-size:15px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; }
  button:disabled { opacity:.6; cursor:default; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .ok { color:var(--good); }
  .err { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1 id="title">Unsubscribe</h1>
  <p id="text">Loading&hellip;</p>
  <button id="btn" hidden>Unsubscribe me</button>
</main>
<script>
(function () {
  var FN = "https://kqfoniinytvuddxiwvkc.supabase.co/functions/v1/marketing-unsubscribe";
  var r = new URLSearchParams(location.search).get("r") || "";
  var title = document.getElementById("title");
  var text = document.getElementById("text");
  var btn = document.getElementById("btn");

  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function call(action) {
    return fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ r: r, action: action }) })
      .then(function (res) { return res.json().catch(function () { return { ok: false }; }); });
  }
  function fail(msg) { title.textContent = "Unsubscribe"; text.innerHTML = '<span class="err">' + esc(msg) + "</span>"; btn.hidden = true; }

  if (r === "preview") { fail("This is a preview or test email, so there is nothing to unsubscribe from."); return; }

  call("lookup").then(function (d) {
    if (!d.ok) { fail(d.error || "This unsubscribe link is not valid."); return; }
    if (d.already) {
      title.textContent = "You are unsubscribed";
      text.innerHTML = "<b>" + esc(d.email) + "</b> will not receive marketing emails from <b>" + esc(d.from) + "</b>.";
      return;
    }
    text.innerHTML = "Stop marketing emails from <b>" + esc(d.from) + "</b> to <b>" + esc(d.email) + "</b>?";
    btn.hidden = false;
  }).catch(function () { fail("Could not reach the server. Please try again in a minute."); });

  btn.addEventListener("click", function () {
    btn.disabled = true;
    btn.textContent = "Unsubscribing…";
    call("unsubscribe").then(function (d) {
      if (!d.ok) { btn.disabled = false; btn.textContent = "Unsubscribe me"; text.innerHTML = '<span class="err">' + esc(d.error || "Something went wrong. Please try again.") + "</span>"; return; }
      title.textContent = "You are unsubscribed";
      text.innerHTML = '<span class="ok">Done.</span> <b>' + esc(d.email) + "</b> will not receive marketing emails from <b>" + esc(d.from) + "</b> again.";
      btn.hidden = true;
    }).catch(function () { btn.disabled = false; btn.textContent = "Unsubscribe me"; });
  });
})();
</script>
</body>
</html>
