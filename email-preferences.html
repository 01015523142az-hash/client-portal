<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Email preferences</title>
<!--
  v796: the link at the foot of every automatic email from a PropTech AI rep
  lands here (?t=<dialer_auto_messages id>). The person chooses which KIND of
  email to keep -- offers and pricing, or follow-ups from their rep -- or stops
  them all. Nothing changes on load (mail scanners open links on their own);
  only a click saves. Backend: the email-preferences function. Gmail/Yahoo
  one-click unsubscribe posts to the same function and stops both kinds.
  Account & service emails to clients are managed in the client portal.
-->
<style>
  :root { --bg:#f6f3ee; --card:#ffffff; --text:#1f2328; --text-2:#5b6068; --border:#e3ddd3; --accent:#1f6feb; --good:#1a9a5c; --bad:#c3272c; --row:#faf8f4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10131a; --card:#171b23; --text:#e8e6e1; --text-2:#a3a7ae; --border:#2a303b; --accent:#6aa3ff; --good:#3dd68c; --bad:#ff7a7e; --row:#1d222c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px 24px; }
  h1 { font-size:21px; margin:0 0 10px; }
  p { margin:0 0 14px; color:var(--text-2); }
  b { color:var(--text); }
  .choice { display:flex; gap:12px; align-items:flex-start; padding:12px; margin:0 0 10px; border:1px solid var(--border);
            border-radius:10px; background:var(--row); cursor:pointer; }
  .choice input { width:20px; height:20px; margin:2px 0 0; flex:none; accent-color:var(--accent); cursor:pointer; }
  .choice .l { font-weight:600; color:var(--text); display:block; }
  .choice .h { font-size:13px; color:var(--text-2); display:block; }
  .note { font-size:13px; }
  .note a { color:var(--accent); }
  button { width:100%; border:0; border-radius:8px; padding:12px 16px; font-size:15px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; margin-top:6px; }
  button.link { background:transparent; color:var(--text-2); font-weight:600; text-decoration:underline; padding:10px; }
  button:disabled { opacity:.6; cursor:default; }
  button:focus-visible, .choice input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .ok { color:var(--good); }
  .err { color:var(--bad); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Email preferences</h1>
  <p id="text">Loading&hellip;</p>
  <form id="form" hidden>
    <div id="choices"></div>
    <p class="note" id="account" hidden></p>
    <button type="submit" id="save">Save my choices</button>
    <button type="button" class="link" id="all">Unsubscribe from all of these emails</button>
  </form>
  <p id="msg" role="status"></p>
</main>
<script>
(function () {
  var FN = "https://kqfoniinytvuddxiwvkc.supabase.co/functions/v1/email-preferences";
  var t = new URLSearchParams(location.search).get("t") || "";
  var title = document.getElementById("title");
  var text = document.getElementById("text");
  var form = document.getElementById("form");
  var choices = document.getElementById("choices");
  var account = document.getElementById("account");
  var save = document.getElementById("save");
  var all = document.getElementById("all");
  var msg = document.getElementById("msg");

  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function call(body) {
    body.t = t;
    return fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (res) { return res.json().catch(function () { return { ok: false }; }); });
  }
  function fail(m) { title.textContent = "Email preferences"; text.innerHTML = '<span class="err">' + esc(m) + "</span>"; form.hidden = true; }
  function busy(on) { save.disabled = on; all.disabled = on; }

  function render(d) {
    text.innerHTML = "Choose which emails <b>" + esc(d.from) + "</b> sends to <b>" + esc(d.email) + "</b>. Untick what you don't want.";
    choices.innerHTML = (d.choices || []).map(function (c) {
      return '<label class="choice"><input type="checkbox" name="' + esc(c.key) + '"' + (c.subscribed ? " checked" : "") + ">"
        + '<span><span class="l">' + esc(c.label) + '</span><span class="h">' + esc(c.hint) + "</span></span></label>";
    }).join("");
    if (d.account_link) {
      account.innerHTML = "Account and service emails for your PropTech AI account are managed in your "
        + '<a href="' + esc(d.account_link) + '">client portal</a> (the bell icon &rarr; Notification settings).';
      account.hidden = false;
    }
    form.hidden = false;
  }
  function done(d, allOff) {
    busy(false);
    if (!d.ok) { msg.innerHTML = '<span class="err">' + esc(d.error || "Something went wrong. Please try again.") + "</span>"; return; }
    render(d);
    var kept = (d.choices || []).filter(function (c) { return c.subscribed; }).length;
    title.textContent = allOff || !kept ? "You are unsubscribed" : "Preferences saved";
    msg.innerHTML = '<span class="ok">Saved.</span> ' + (allOff || !kept
      ? "You won't get these emails from us again."
      : "You'll only get the emails you left ticked.");
  }

  if (!t) { fail("This link is not valid."); return; }
  call({ action: "lookup" }).then(function (d) {
    if (!d.ok) { fail(d.error || "This link is not valid."); return; }
    render(d);
  }).catch(function () { fail("Could not reach the server. Please try again in a minute."); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    busy(true); msg.textContent = "Saving…";
    var box = function (k) { var el = form.querySelector('input[name="' + k + '"]'); return !!(el && el.checked); };
    call({ action: "save", marketing: box("marketing"), follow_up: box("follow_up") })
      .then(function (d) { done(d, false); })
      .catch(function () { busy(false); msg.innerHTML = '<span class="err">Could not reach the server.</span>'; });
  });
  all.addEventListener("click", function () {
    busy(true); msg.textContent = "Saving…";
    call({ action: "unsubscribe_all" })
      .then(function (d) { done(d, true); })
      .catch(function () { busy(false); msg.innerHTML = '<span class="err">Could not reach the server.</span>'; });
  });
})();
</script>
</body>
</html>
